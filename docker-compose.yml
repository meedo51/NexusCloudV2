services:
  postgres:
    image: postgres:16-alpine
    container_name: nexuscloud-postgres
    environment:
      - POSTGRES_DB=nexuscloud
      - POSTGRES_USER=${DB_USER:-nexuscloud}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuscloud -d nexuscloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    container_name: nexuscloud-webhook
    restart: unless-stopped
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # ✅ CHANGED - Mount from actual directory
      - /root/NexusCloudV2/deploy.sh:/root/NexusCloudV2/deploy.sh:ro
      - /root/NexusCloudV2:/root/NexusCloudV2:ro
    networks:
      - nexuscloud-net
    ports:
      - "${DB_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: nexuscloud-backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret-in-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=nexuscloud
      - DB_USER=${DB_USER:-nexuscloud}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_SSL=false
      - DATABASE_URL=postgresql://${DB_USER:-nexuscloud}:${DB_PASSWORD:-changeme}@postgres:5432/nexuscloud
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:9000,http://localhost:3000}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - ENABLE_2FA=true
      - ENABLE_WEBDAV=true
      - ENABLE_FULLTEXT_SEARCH=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${BACKEND_PORT:-5000}:4000
    volumes:
      - uploads:/app/uploads
    networks:
      - nexuscloud-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    container_name: nexuscloud-frontend
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-9000}:80
    networks:
      - nexuscloud-net

networks:
  nexuscloud-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
