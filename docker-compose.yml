services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: nexuscloud-backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret-in-production}
      - DB_PATH=/app/data/nexuscloud.db
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:4000/api/health
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    ports:
      - ${BACKEND_PORT:-5000}:4000
    volumes:
      - uploads:/app/uploads
      - database:/app/data
    networks:
      - nexuscloud-net
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    container_name: nexuscloud-frontend
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-9000}:80
    #depends_on:
      #- backend
    networks:
      - nexuscloud-net
networks:
  nexuscloud-net: 
volumes:
  uploads:
    driver: local
  database:
    driver: local
